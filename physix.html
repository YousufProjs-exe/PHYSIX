<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHYSIX - Simulation</title>
    <link rel="stylesheet" href="physix.css">
</head>
<body>
    <canvas id="canvas" width="800px" height="600px"></canvas>
    <div class="container">
        
        <h2>PHYSIX</h2>
        <p>Physics and Graphs Simpulation!</p>

        <div class="input">
            <input type="number" placeholder="Speed of the Object" id="speed" type="text">
            <input type="number" placeholder="Angle of the Object" id="angle" type="text">
            <input type="number" placeholder="Height" id="height" type="text">

            <button id="reset" onclick="">Start</button>
            <button id="reset" onclick="">Reset</button>
        </div>
    </div>
    
</body>
</html>
